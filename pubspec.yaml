name: predictme
description: "Predict Me：本地生成人设，并行询问 DeepSeek，再汇总这一次的判断。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.9.2
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.1
  loglens: ^0.5.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.34.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
